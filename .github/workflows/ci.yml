name: CI

# Release gate for every push and pull request (REL-FR-04). Runs the same
# commands the README documents:
#   typecheck -> unit/integration tests -> production build -> Playwright E2E
#   -> subpath/origin audit -> bundle budget
# No secrets are used; every step is a local command.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, E2E and audits
    runs-on: ubuntu-latest
    # The E2E suite is tri-browser and runs single-worker in CI: the per-test
    # sum on the release machine (8c0f89d) is 95.4 minutes for 954 passing
    # tests, before the two retries a failing test may take. The old 30-minute
    # ceiling could not reach the audits, so the release gate could never pass
    # on CI (ticket #25).
    timeout-minutes: 180

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end journeys
        run: npm run test:e2e

      - name: Subpath build and origin audit
        run: node scripts/check-build.mjs

      - name: Bundle budget
        run: node scripts/check-budget.mjs

      # AB-E2: the sweep writes one full-page frame per route per viewport to
      # test-results/screenshots/ on every run. They are evidence, never
      # baselines, so they are uploaded whether the run passed or failed.
      - name: Upload the five-viewport sweep (AB-E2)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: test-results/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
