name: CI

# Release gate for every push and pull request (REL-FR-04). Runs the same
# commands the README documents:
#   typecheck -> unit/integration tests -> production build -> Playwright E2E
#   -> subpath/origin audit -> bundle budget
# No secrets are used; every step is a local command.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, E2E and audits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end journeys
        run: npm run test:e2e

      - name: Subpath build and origin audit
        run: node scripts/check-build.mjs

      - name: Bundle budget
        run: node scripts/check-budget.mjs

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
